<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Journalism | Sashi</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f5f5f5;
      color: #111;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #111;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin: 0;
    }

    .articles-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    .article-card {
      background-color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease;
    }

    .article-card:hover {
      transform: scale(1.01);
    }

    .article-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .article-content {
      padding: 1.5rem;
    }

    .article-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    .article-meta {
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Infrared Lens</h1>
    <h2> By Sashi</h2>
  </header>

  <div class="articles-container">
    <a href="CAA_Article.html" class="article-card">
      <img src="CAA_image.png" alt="Article 1" class="article-image" />
      <div class="article-content">
        <div class="article-title">The Citizenship Amendment Act: Beyond the Headlines</div>
        <div class="article-meta">Published: April 2025</div>
      </div>
    </a>

    <div class="articles-container">
    <a href="Population_Control.html" class="article-card">
      <img src="Population_density_image.png" alt="Article 2" class="article-image" />
      <div class="article-content">
        <div class="article-title">The Need and Challenges of Introducing a Population Control Bill in India</div>
        <div class="article-meta">Published: In Progress</div>
      </div>
    </a>

</html>
